[project]
name = "vocaliscast"
version = "0.1.0"
description = "Generate language-learning podcasts: episodes in your native language that teach a handful of foreign words by using them in context, with a local or hosted LLM and TTS."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dennis Jandow" }]
keywords = ["language-learning", "podcast", "tts", "llm", "langgraph", "vocabulary", "spaced-repetition"]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain>=1.4",
    "sqlalchemy>=2.0",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "numpy>=2.0",
    "babel>=2.17",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.1"]
openai = ["langchain-openai>=1.1"]
anthropic = ["langchain-anthropic>=1.1"]
chatterbox = ["chatterbox-tts>=0.1.7"]
postgres = ["langgraph-checkpoint-postgres>=3.1", "psycopg[binary]>=3.2"]
dev = ["pytest>=8.4", "ruff>=0.14"]

[project.scripts]
vocaliscast = "vocaliscast.cli:main"

[project.urls]
Homepage = "https://github.com/janthoXO/VocalisCast"
Repository = "https://github.com/janthoXO/VocalisCast"
Issues = "https://github.com/janthoXO/VocalisCast/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]  # ruff reformats python blocks inside markdown, leave the docs alone

[tool.pytest.ini_options]
testpaths = ["tests"]
